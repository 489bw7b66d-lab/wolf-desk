<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tests – Wolf Desk</title>
<style>
body{margin:0;background:#0E0D0B;color:#F1ECE0;font:15px/1.5 "Helvetica Neue",Helvetica,Arial,sans-serif;padding:24px 16px}
h1{font-size:24px;margin:0 0 4px}.sum{margin:0 0 16px;font-weight:700}
li{padding:6px 0;border-top:1px solid #2A261C;list-style:none}ul{padding:0}
.ok{color:#4ADE9B}.bad{color:#FF7070}
</style>
</head>
<body>
<h1>Rechen-Tests</h1>
<p id="sum" class="sum">Läuft …</p>
<ul id="list"></ul>
<!-- Version aller Dateien: bei jedem Update erhöhen, damit das iPhone keine alten Dateien nutzt -->
<script>
  // 6a: Die Import-Liste (mit Versionsnummer) kommt aus index.html, damit es nur EINE Liste gibt
  (function () {
    var x = new XMLHttpRequest();
    x.open('GET', 'index.html?t=' + Date.now(), false);
    x.send();
    var m = x.responseText.match(/<script type="importmap">([\s\S]*?)<\/script>/);
    var s = document.createElement('script');
    s.type = 'importmap';
    s.textContent = m ? m[1] : '{"imports":{}}';
    document.currentScript.after(s);
  })();
</script>
<script type="module">
import { tests as calc } from './test-calc.js';
import { tests as risk } from './test-risk.js';
import { tests as perf } from './test-performance.js';
import { tests as sig } from './test-signals.js';
import { tests as trades } from './test-trades.js';
import { tests as mkt } from './test-market.js';
import { tests as bt } from './test-backtest.js';
import { tests as al } from './test-alerts.js';
import { tests as st } from './test-settings.js';
import { tests as vw } from './test-views.js';
import { tests as fe } from './test-fees.js';
import { tests as pa } from './test-path.js';
import { tests as pl } from './test-plans.js';
import { tests as ap } from './test-autoplan.js';
import { tests as gu } from './test-guard.js';
import { tests as pt } from './test-patience.js';
import { tests as fp } from './test-feedplan.js';
import { tests as lp } from './test-levpreview.js';
import { tests as tr } from './test-tradeable.js';
import { tests as ch } from './test-chart.js';
import { tests as tl } from './test-trail.js';
import { tests as tg } from './test-trendgate.js';
import { tests as hd } from './test-handling.js';
import { tests as pv } from './test-privacy.js';
import { tests as s5 } from './test-signal5f.js';
import { tests as ps } from './test-positions.js';
import { tests as pst } from './test-planstate.js';
import { tests as e2 } from './test-engine2.js';
import { tests as xc } from './test-exitcalc.js';
import { tests as tk } from './test-totalrisk.js';
import { tests as jm } from './test-journalmeasure.js';
import { tests as gs } from './test-gesture.js';
import { tests as po } from './test-position.js';
import { tests as bm } from './test-benchmark.js';
import { tests as rg } from './test-regime.js';
import { tests as ec } from './test-exitcompare.js';
import { tests as dc } from './test-donchian.js';
import { tests as bx } from './test-btmetrics.js';
import { tests as rb } from './test-riskbudget.js';
import { tests as rn } from './test-randombase.js';
import { tests as bn } from './test-binance.js';
import { tests as lt } from './test-longtest.js';
const tests = [...calc, ...risk, ...perf, ...sig, ...trades, ...mkt, ...bt, ...al, ...st, ...vw, ...fe, ...pa, ...pl, ...ap, ...gu, ...pt, ...fp, ...lp, ...tr, ...ch, ...tl, ...tg, ...hd, ...pv, ...s5, ...ps, ...pst, ...e2, ...xc, ...tk, ...jm, ...gs, ...po, ...bm, ...rg, ...ec, ...dc, ...bx, ...rb, ...rn, ...bn, ...lt];
let pass = 0;
const list = document.getElementById('list');
for (const [name, fn] of tests) {
  let ok = false;
  try { ok = fn() === true; } catch (e) { ok = false; }
  if (ok) pass++;
  const li = document.createElement('li');
  li.innerHTML = `<span class="${ok ? 'ok' : 'bad'}">${ok ? '✓' : '✗'}</span> `;
  li.append(name);
  list.append(li);
}
const sum = document.getElementById('sum');
sum.textContent = `${pass} von ${tests.length} Tests bestanden`;
sum.className = 'sum ' + (pass === tests.length ? 'ok' : 'bad');
</script>
</body>
</html>
